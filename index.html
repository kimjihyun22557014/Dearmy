<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="자주 쓰거나 곁에 두는 물건과 그 이야기를 모으는 온라인 참여 아카이브.">
  <title>Dear My (?) — 나의 애착 물건 아카이브</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='11' fill='%232640ce'/%3E%3Ctext x='32' y='48' text-anchor='middle' fill='white' font-family='serif' font-size='49'%3E%3F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&amp;display=swap&amp;text=Dear%20My%20%28%3F%29">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" crossorigin>
  <link rel="stylesheet" href="./style.css?v=nunito-pretendard">
  <script type="module" src="./app.js?v=single-archive"></script>
</head>
<body>
  <main class="desk" aria-label="문장 속 물건">
    <p id="notice" role="status" aria-live="polite"></p>
    <div id="scene" tabindex="-1"></div>
    <nav id="pagination" class="pagination" aria-label="기록 페이지" hidden>
      <button id="previous-page" type="button">이전</button>
      <p id="page-number" aria-live="polite"></p>
      <button id="next-page" type="button">다음</button>
    </nav>
    <footer class="intro">
      <h1 class="wordmark">Dear My (<span class="wordmark-question">?</span>)</h1>
      <p>나의 애착 물건 아카이브</p>
    </footer>
  </main>
  <button id="add" class="upload-cta" type="button" aria-haspopup="dialog" aria-controls="upload">
    <img src="./assets/upload-button-dark-green.png" alt="" width="56" height="56">
    <span class="upload-note">애착 물건 올리기</span>
  </button>
  <dialog id="story" aria-labelledby="story-title">
    <div class="bar"><span>물건의 이야기</span><button type="button" data-close aria-label="닫기">✕</button></div>
    <div class="story-body">
      <img id="story-image" alt="">
      <div><p id="story-meta" class="meta"></p><h2 id="story-title"></h2><p id="story-text"></p></div>
    </div>
    <footer id="story-actions" class="story-actions" hidden></footer>
  </dialog>
  <dialog id="upload" aria-labelledby="upload-title">
    <div class="bar"><h2 id="upload-title">물건 올리기</h2><button type="button" data-close aria-label="닫기">✕</button></div>
    <form id="upload-form">
      <div class="upload-images">
        <label for="photo">물건 사진
          <span>물건 하나가 잘 보이는 사진을 올려주세요. 아이폰 HEIC 사진도 가능해요.</span>
          <input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif,.heic,.heif,.heics,.heifs" required>
        </label>
        <div class="previews" hidden>
          <figure><img id="original" alt="배경 제거 전"><figcaption>원본</figcaption></figure>
          <figure><img id="cutout" alt="배경 제거 결과" hidden><figcaption>배경 제거 후</figcaption></figure>
        </div>
        <p id="processing" role="status" aria-live="polite"></p>
        <button id="retry-photo" type="button" hidden>배경 제거 다시 시도</button>
      </div>
      <div class="fields">
        <label>물건의 이름<input name="name" required maxlength="60" placeholder="예. 무선 이어폰"></label>
        <label>함께한 시간<input name="duration" required maxlength="40" placeholder="예. 2년"></label>
      </div>
      <fieldset class="story-questions" aria-describedby="question-help">
        <legend>물건의 이야기</legend>
        <p id="question-help" class="question-help">한 질문에만 답해도 돼요.</p>
        <div class="question-field">
          <label for="answer-when">1. 이 물건을 언제 가장 자주 쓰거나 곁에 두나요?</label>
          <textarea id="answer-when" name="answer" maxlength="240" rows="2" placeholder="예. 등굣길 지하철에서 이어폰을 꺼내요."></textarea>
        </div>
        <div class="question-field">
          <label for="answer-change">2. 이 물건 덕분에 그 시간이 어떻게 달라졌나요?</label>
          <textarea id="answer-change" name="answer" maxlength="240" rows="2" placeholder="예. 좋아하는 음악을 들으니 등굣길이 덜 지루해요."></textarea>
        </div>
        <div class="question-field">
          <label for="answer-origin">3. 이 물건은 어디서, 어떻게 구했나요?</label>
          <textarea id="answer-origin" name="answer" maxlength="240" rows="2" placeholder="예. 입학 선물로 친구에게 받았어요."></textarea>
        </div>
        <div class="question-field">
          <label for="answer-favorite">4. 이 물건에서 가장 마음에 드는 점은 뭔가요?</label>
          <textarea id="answer-favorite" name="answer" maxlength="240" rows="2" placeholder="예. 주머니에 쏙 들어가는 크기가 좋아요."></textarea>
        </div>
      </fieldset>
      <div class="form-end"><p id="storage-note"></p><button id="publish" type="submit" class="primary" disabled>등록하기 <span aria-hidden="true">↗</span></button></div>
      <p id="form-error" role="alert"></p>
    </form>
  </dialog>
</body>
</html>
